name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify references
        shell: pwsh
        run: |
          $required = @(
            "libs/BepInEx.dll",
            "libs/Assembly-CSharp.dll",
            "libs/UnityEngine.dll",
            "libs/UnityEngine.CoreModule.dll",
            "libs/UnityEngine.IMGUIModule.dll",
            "libs/UnityEngine.InputLegacyModule.dll",
            "libs/UnityEngine.UI.dll"
          )

          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing.Count -gt 0) {
            Write-Error "Required local references are missing."
            exit 1
          }

      - name: Build
        run: dotnet build NameTag-Hider.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/BepInEx/plugins | Out-Null
          Copy-Item "bin/Release/NameTag-Hider.dll" "release/BepInEx/plugins/NameTag-Hider.dll"
          Compress-Archive -Path "release/BepInEx" -DestinationPath "release/NameTag-Hider.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/NameTag-Hider.zip
